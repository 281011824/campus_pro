# 主云 Nginx：公网 19002 -> WireGuard -> 台式机 10.66.0.4:5004
# 备用：台式机不可达时回落主云本机 127.0.0.1:5004（同代码同库快照）
# 放置：/etc/nginx/conf.d/htw.conf （root:root 0600），reload 生效，不重启
# 19001 已被“学生管理系统”占用，本服务固定使用 19002。

# 令牌含长串字符，默认 64 的哈希桶不够
map_hash_bucket_size 128;

# 浏览器走 Cookie，脚本/客户端走请求头，二者满足其一即可
map $http_x_gateway_token $htw_hdr_ok {
    default 0;
    "__GATEWAY_TOKEN__" 1;
}
map $cookie_htw_gw $htw_cookie_ok {
    default 0;
    "__GATEWAY_TOKEN__" 1;
}

# 登录会话：这里只看 Cookie 是否存在，有效性由应用层 HMAC 校验（无会话时业务接口一律 401）
map $cookie_htw_session $htw_sess_ok {
    default 0;
    "~." 1;
}

# 登录页与其静态资源公开，便于直接访问 /api/v1/login
map $uri $htw_public {
    default 0;
    "~^/api/v1/(login|logout)$" 1;
    "~^/static/(login|vendor)/" 1;
    "~^/favicon\.ico$" 1;
}

map "$htw_hdr_ok$htw_cookie_ok$htw_sess_ok$htw_public" $htw_allow {
    default 0;
    "~1" 1;
}

# 主备：优先台式机 10.66.0.4；台式机不可达时自动回落主云本机 127.0.0.1:5004
upstream htw_desktop {
    server 10.66.0.4:5004 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5004 backup;
    keepalive 16;
}

server {
    listen 19002;
    listen [::]:19002;
    server_name _;

    server_tokens off;
    client_max_body_size 8m;

    access_log /var/log/nginx/htw.access.log;
    error_log  /var/log/nginx/htw.error.log warn;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 浏览器首次入口：/__gate?token=令牌，下发 HttpOnly Cookie 后跳首页
    location = /__gate {
        if ($arg_token != "__GATEWAY_TOKEN__") { return 403; }
        add_header Set-Cookie "htw_gw=__GATEWAY_TOKEN__; Path=/; HttpOnly; SameSite=Lax; Max-Age=86400" always;
        return 302 /;
    }

    location = /__logout {
        add_header Set-Cookie "htw_gw=; Path=/; Max-Age=0" always;
        return 302 /__gate;
    }

    location / {
        # 令牌 / 会话 / 公开路径，满足其一即放行
        if ($htw_allow = 0) { return 403; }
        proxy_pass http://htw_desktop;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 连接失败与网关类错误才切备用，不对已发送的非幂等请求重试
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 身份由应用层从会话 Cookie 解析，不再透传可伪造的身份头
        proxy_set_header X-Auth-User       "";

        proxy_connect_timeout 3s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
        proxy_buffering off;
    }
}
