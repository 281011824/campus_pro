<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4A0C0C">
<title>校园巡查 · 京山市中等职业技术学校</title>
<link rel="stylesheet" href="/static/inspector/app.css?v=20261124b">
</head>
<body>

<header class="topbar">
  <div class="tb-brand">
    <span class="seal" aria-hidden="true">巡</span>
    <div class="tb-text">
      <h1>校园巡查</h1>
      <p><span id="meName">加载中…</span><span class="sep">·</span><span id="meCat"></span></p>
    </div>
  </div>
  <a class="logout" href="/api/v1/logout">退出登录</a>
</header>

<main class="wrap" id="wrap">

  <div class="alert" id="denied" hidden>当前账号无权使用巡查记录模块，请联系政教处或管理员。</div>

  <!-- 今日概览 -->
  <section class="overview" aria-label="今日概览">
    <div class="ov-main">
      <div class="ov-item">
        <span class="ov-k">今日记录</span>
        <b class="ov-v" id="sumCount">—</b>
        <span class="ov-u">条</span>
      </div>
      <div class="ov-item">
        <span class="ov-k">今日净分</span>
        <b class="ov-v" id="sumPoints">—</b>
      </div>
    </div>
    <p class="ov-sub" id="sumSub">违纪 — · 仪容 — · 卫生 —</p>
  </section>

  <div class="cols">

    <!-- 左：记录区 -->
    <div class="col-main">

      <section class="panel">
        <div class="panel-head"><h2>学生</h2><span class="tag">按姓名或学号</span></div>
        <input type="search" id="q" class="search-input" placeholder="输入学生姓名或学号"
               autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <div class="results" id="searchResults" hidden></div>
        <p class="hint" id="searchHint">搜索并选中学生后可记录违纪与仪容；不选学生也可记录卫生。</p>
      </section>

      <div class="picked" id="picked" hidden>
        <div class="picked-info">
          <span class="picked-k">正在记录</span>
          <div class="picked-body">
            <b id="pickedName"></b><span id="pickedMeta" class="picked-meta"></span>
          </div>
        </div>
        <div class="picked-ops">
          <button type="button" class="btn ghost sm" data-act="change-student">更换</button>
          <button type="button" class="btn ghost sm" data-act="clear-student">清除</button>
        </div>
      </div>

      <div class="note-box">
        <button type="button" class="note-toggle" id="noteToggle" data-act="toggle-note">加备注</button>
        <div class="note-field" id="noteField" hidden>
          <input type="text" id="noteInput" maxlength="100" placeholder="备注（可选，最多 100 字）">
        </div>
      </div>

      <section class="panel">
        <div class="panel-head">
          <h2>违纪违规</h2>
          <span class="tag danger">每项 -1 分</span>
        </div>
        <div class="item-grid" id="violationItems"><p class="loading">加载中…</p></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>仪容仪表</h2>
          <span class="tag warn">每项 -1 分</span>
        </div>
        <div class="item-grid" id="appearanceItems"><p class="loading">加载中…</p></div>
      </section>

      <section class="panel" id="sanPanel">
        <div class="panel-head">
          <h2>卫生检查</h2>
          <span class="tag ok">班级 / 寝室级</span>
        </div>

        <div class="seg" id="sanObjects" role="tablist" aria-label="卫生对象">
          <button type="button" class="seg-btn on" role="tab" data-act="san-object" data-obj="classroom">教室卫生</button>
          <button type="button" class="seg-btn" role="tab" data-act="san-object" data-obj="dorm">寝室卫生</button>
          <button type="button" class="seg-btn" role="tab" data-act="san-object" data-obj="area">清洁区</button>
        </div>

        <label class="field-label" for="sanTarget" id="sanTargetLabel">选择班级</label>
        <select id="sanTarget"><option value="">加载中…</option></select>
        <div class="dorm-picker hidden" id="dormPicker">
          <input id="sanTargetInput" class="san-input" type="text" inputmode="numeric"
                 autocomplete="off" placeholder="输入寝室号，如 3105">
          <div class="suggest" id="sanSuggest" hidden></div>
        </div>
        <p class="field-hint" id="sanHint" hidden></p>

        <div class="san-actions">
          <button type="button" class="san-btn good" id="sanGood" data-act="san-submit" data-pts="1" disabled>优 +1</button>
          <button type="button" class="san-btn bad" id="sanBad" data-act="san-submit" data-pts="-1" disabled>差 -1</button>
        </div>
        <p class="hint">先选对象与目标，再点「优」或「差」，点击即记录；无需选中学生。</p>
      </section>

    </div>

    <!-- 右：今日记录 -->
    <div class="col-side">
      <section class="panel">
        <div class="panel-head">
          <h2>今日记录</h2>
          <span class="tag" id="recCount">— 条</span>
        </div>

        <div class="filter-row">
          <div class="seg seg-mini" id="catFilter" aria-label="类别筛选">
            <button type="button" class="seg-btn on" data-act="cat" data-cat="">全部</button>
            <button type="button" class="seg-btn" data-act="cat" data-cat="violation" title="违纪违规" aria-label="违纪违规">违纪</button>
            <button type="button" class="seg-btn" data-act="cat" data-cat="appearance" title="仪容仪表" aria-label="仪容仪表">仪容</button>
            <button type="button" class="seg-btn" data-act="cat" data-cat="sanitation" title="卫生检查" aria-label="卫生检查">卫生</button>
          </div>
          <label class="switch" for="mineFilter">
            <input type="checkbox" id="mineFilter">
            <span>只看我的</span>
          </label>
        </div>

        <div class="rec-list" id="recList"><p class="loading">加载中…</p></div>
      </section>
    </div>

  </div>

  <footer class="foot">京山市中等职业技术学校 · 校园巡查记录 · 版本 v1.0 · v20261124a</footer>

</main>

<div class="modal" id="confirmModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle">确认操作</h3>
    <p id="confirmText"></p>
    <div class="modal-foot">
      <button type="button" class="btn ghost" id="confirmCancel">取消</button>
      <button type="button" class="btn danger" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/inspector/app.js?v=20261124c"></script>
</body>
</html>
