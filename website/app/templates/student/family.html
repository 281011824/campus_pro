<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#123a6b">
<title>家长端 · 京山市中等职业技术学校</title>
<link rel="stylesheet" href="/static/student/app.css?v=20261125student2">
</head>
<body class="family" data-authed="{{ '1' if authed else '0' }}">
<div id="app">

  <header class="appbar">
    <button type="button" id="btn-back" class="appbar-back" hidden aria-label="返回">‹</button>
    <div class="appbar-title">
      <b id="app-title">家长端</b>
      <small id="app-sub">京山中职 · 仅绑定学生</small>
    </div>
    <button type="button" class="appbar-right" id="fam-logout" hidden>退出</button>
  </header>

  <main id="view" aria-live="polite">
    <div class="sk-card"><div class="sk-line w40"></div><div class="sk-line w80"></div></div>
  </main>

  <p class="family-foot" id="family-foot" hidden>家长视图 · 仅绑定学生</p>

  <nav class="tabbar four" id="tabbar" aria-label="家长导航" hidden>
    <button type="button" data-tab="home" class="on" aria-current="page">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v9a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>首页</span>
    </button>
    <button type="button" data-tab="timeline">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>时间轴</span>
    </button>
    <button type="button" data-tab="profile">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4M4 20h16"/><path d="m7 15 4-5 3 3 5-7"/></svg>
      <span>画像</span>
    </button>
    <button type="button" data-tab="todos">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 2 2 3-3M4 13l2 2 3-3M4 20l2 2 3-3"/><path d="M13 6h7M13 13h7M13 20h7"/></svg>
      <span>待办</span>
    </button>
  </nav>

</div>

<noscript><p style="padding:20px;text-align:center">本页面需要启用 JavaScript 才能查看孩子的成长信息。</p></noscript>

<script src="/static/student/app.js?v=20261125student2"></script>
<script src="/static/student/family.js?v=20261125student2"></script>
</body>
</html>
