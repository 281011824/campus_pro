<body>
<div id="app">

  <header class="appbar">
    <button type="button" id="btn-back" class="appbar-back" hidden aria-label="返回">‹</button>
    <div class="appbar-title">
      <b id="app-title">成长门户</b>
      <small id="app-sub">京山中职 · 学生成长</small>
    </div>
    <a class="appbar-right" href="/api/v1/logout">退出</a>
  </header>

  <main id="view" aria-live="polite">
    <div class="sk-card"><div class="sk-line w40"></div><div class="sk-line w80"></div></div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button type="button" data-tab="home" class="on" aria-current="page">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7v9a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>首页</span>
    </button>
    <button type="button" data-tab="assess">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      <span>测评</span>
    </button>
    <button type="button" data-tab="timeline">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>时间轴</span>
    </button>
    <button type="button" data-tab="todo">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 2 2 3-3M4 13l2 2 3-3M4 20l2 2 3-3"/><path d="M13 6h7M13 13h7M13 20h7"/></svg>
      <span>待办</span>
    </button>
    <button type="button" data-tab="mine">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
      <span>我的</span>
    </button>
  </nav>

</div>
