# 请根据自身需求修改
APP_TITLE: 班主任工作台-dev
APP_SUMMARY: Head Teacher Workbench
APP_DESCRIPTION: 班主任工作台 Web 层（Redis 协议适配）
APP_VERSION: 1.0.0
APP_DEBUG: true
APP_LOG_SERIALIZE: false
APP_LOG_OUTDIR: ./logs
APP_DISABLE_DOCS: false
APP_ALLOW_CREDENTIALS: true
APP_ALLOW_ORIGINS:
  - "*"
APP_ALLOW_METHODS:
  - "*"
APP_ALLOW_HEADERS:
  - "*"
# 班主任工作台独立请求/响应通道（同名系统环境变量优先）
HEAD_TEACHER_WORKBENCH_REDIS_URL: redis://127.0.0.1:6379/0
HEAD_TEACHER_WORKBENCH_REQUEST_QUEUE: head_teacher_workbench:requests
HEAD_TEACHER_WORKBENCH_RESPONSE_PREFIX: "head_teacher_workbench:response:"
HEAD_TEACHER_WORKBENCH_REQUEST_TIMEOUT_SECONDS: 5.0
HEAD_TEACHER_WORKBENCH_RESPONSE_TTL_SECONDS: 30
